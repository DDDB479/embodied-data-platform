name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python package with optional readers
        run: python -m pip install -e ".[all]"
      - name: Generate fixtures
        run: python tools/make_fixtures.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: End-to-end tests
        run: python tools/e2e.py
      - name: Plugin probe
        run: node packages/dsh-plugin/scripts/probe.mjs --python "$(python -c 'import sys; print(sys.executable)')"
      - name: Plugin unit tests
        run: node --test packages/dsh-plugin/test/*.test.mjs

  minimal:
    name: minimal (no optional readers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install core only
        run: python -m pip install -e .
      - name: Unit tests degrade gracefully without pyarrow/h5py/mcap
        run: python -m unittest discover -s tests -t . -v
      - name: Plugin unit tests
        run: node --test packages/dsh-plugin/test/*.test.mjs

  clean-install:
    name: clean install (packed npm tarball)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python readers for the fixture
        run: python -m pip install -e ".[all]"
      - name: Generate fixtures
        run: python tools/make_fixtures.py
      - name: Pack, install into a temp app and probe
        run: node tools/check_clean_install.mjs --python "$(python -c 'import sys; print(sys.executable)')" --fixture .devtools/fixtures/lerobot_v21
