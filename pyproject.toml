[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-core"
version = "0.5.0"
description = "Format-aware platform toolkit for embodied-AI datasets: CDR/RLDS decoding, media inventory, QC, versioned catalog, training export and object storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Embodied Data Studio" }]
keywords = ["embodied-ai", "robotics", "dataset", "lerobot", "mcap", "rosbag", "hdf5", "mcp", "dsh"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Optional accelerators. The core degrades gracefully when they are absent.
parquet = ["pyarrow>=14"]
hdf5 = ["h5py>=3.9"]
mcap = ["mcap>=1.1"]
s3 = ["boto3>=1.34"]
all = ["pyarrow>=14", "h5py>=3.9", "mcap>=1.1", "boto3>=1.34"]

[project.scripts]
embodied = "embodied_core.cli:main"
embodied-mcp = "embodied_core.mcp_server:main"
embodied-api = "embodied_core.api:main"

[project.urls]
Homepage = "https://github.com/DDDB479/embodied-data-platform"
Repository = "https://github.com/DDDB479/embodied-data-platform"
Issues = "https://github.com/DDDB479/embodied-data-platform/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
